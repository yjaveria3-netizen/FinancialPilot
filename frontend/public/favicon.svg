<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient: Cosmic Deep Space -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e36"/>
      <stop offset="50%" stop-color="#0a051d"/>
      <stop offset="100%" stop-color="#050210"/>
    </linearGradient>

    <!-- Radar Sweep Glow Gradient -->
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#937aff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7e14ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7e14ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Trajectory Line Gradient: Cosmic Indigo to Electric Emerald -->
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="85%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#937aff" stroke-opacity="0.6"/>
      <stop offset="50%" stop-color="#4f46e5" stroke-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stroke-opacity="0.5"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Radar Rings (Pilot Navigation System) -->
  <circle cx="32" cy="32" r="22" stroke="#937aff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="14" stroke="#937aff" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="32" cy="32" r="6" stroke="#937aff" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="32" cy="32" r="22" fill="url(#radarGlow)"/>

  <!-- Radar Crosshairs -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#937aff" stroke-width="0.75" stroke-opacity="0.2"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="#937aff" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Radar Compass / Pilot Azimuth ticks -->
  <circle cx="32" cy="10" r="1.5" fill="#937aff" fill-opacity="0.7"/>
  <circle cx="54" cy="32" r="1.5" fill="#937aff" fill-opacity="0.7"/>
  <circle cx="32" cy="54" r="1.5" fill="#937aff" fill-opacity="0.7"/>
  <circle cx="10" cy="32" r="1.5" fill="#937aff" fill-opacity="0.7"/>

  <!-- Upward Financial Growth Trajectory (Ascending Line) -->
  <path d="M14 44 L25 33 L35 39 L49 19" 
        stroke="url(#chartGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Trajectory Arrowhead -->
  <path d="M40 19 H49 V28" 
        stroke="#34d399" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Financial Node Points -->
  <circle cx="14" cy="44" r="2" fill="#818cf8"/>
  <circle cx="25" cy="33" r="2.5" fill="#c084fc"/>
  <circle cx="35" cy="39" r="2.5" fill="#a855f7"/>
  <circle cx="49" cy="19" r="3" fill="#34d399" filter="url(#glow)"/>
  <circle cx="49" cy="19" r="1.2" fill="#ffffff"/>
</svg>