name: Keep Render Awake

on:
  schedule:
    # Run every 10 minutes (GitHub Actions cron limit)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -sS --max-time 60 https://financialpilot-api.onrender.com/api/health || true
